<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Viewer</title>
  <style>
    :root {
      --bg: #111;
      --panel: #181a1f;
      --panel-2: #20232a;
      --line: #2c3038;
      --text: #e6e8eb;
      --muted: #8b929c;
      --accent: #5b9cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body { display: flex; }

    /* ---------- sidebar ---------- */
    #sidebar {
      width: 250px;
      flex: none;
      height: 100%;
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px 14px 24px;
    }
    #sidebar h1 {
      font-size: 17px;
      font-weight: 650;
      margin: 0 0 2px 4px;
      letter-spacing: 0.2px;
    }
    #sidebar .tagline {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 16px 4px;
    }
    .group { margin-bottom: 14px; }
    .group h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin: 0 0 6px 4px;
    }
    .group .items {
      display: grid;
      gap: 4px;
    }
    .xtal {
      display: flex;
      align-items: baseline;
      gap: 10px;
      text-align: left;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .xtal:hover { background: #2a2e37; }
    .xtal.active {
      background: #1d2d48;
      border-color: var(--accent);
    }
    .xtal .f { font-size: 15px; font-weight: 600; min-width: 46px; }
    .xtal .n { font-size: 12.5px; color: var(--muted); }

    /* ---------- viewport ---------- */
    #viewport {
      position: relative;
      flex: 1;
      height: 100%;
      min-width: 0;
    }
    #viewport canvas { display: block; touch-action: none; }
    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .axis-label {
      color: #9aa1ab;
      font-size: 15px;
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      position: absolute;
      background: rgba(24, 26, 31, 0.5);
      border: 1px solid var(--line);
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    #info {
      top: 14px;
      left: 14px;
      padding: 12px 16px 13px;
      max-width: min(460px, calc(100% - 28px));
    }
    #info .title {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.1;
    }
    #info .title .name { font-size: 0.62em; font-weight: 400; color: var(--muted); margin-left: 6px; }
    #info .desc { margin-top: 5px; font-size: 14px; line-height: 1.4; }
    #info .facts {
      margin-top: 7px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    #hud-bottom {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    #hud-bottom .card { position: static; pointer-events: auto; }
    #legend {
      padding: 9px 13px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.7;
    }
    #legend b { color: var(--text); font-weight: 600; }
    .swatch {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }

    #controls {
      padding: 10px 14px;
      font-size: 13px;
      display: grid;
      gap: 7px;
      min-width: 230px;
    }
    #controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    #controls label .v { min-width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    #controls input[type="range"] { flex: 1; accent-color: var(--accent); }
    #controls input[type="checkbox"] { accent-color: var(--accent); }
    #controls .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    #controls .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    #tiling { display: flex; gap: 4px; }
    #tiling button {
      flex: 1;
      font: inherit;
      font-size: 12.5px;
      padding: 4px 6px;
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 5px;
      cursor: pointer;
    }
    #tiling button.on { color: var(--text); border-color: var(--accent); }

    #sourcelink {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #sourcelink .label { color: var(--muted); }
    #sourcelink .url { color: var(--accent); }
    #sourcelink:hover { border-color: var(--accent); background: rgba(91, 156, 255, 0.12); }
    #sourcelink:hover .url { text-decoration: underline; }

    #menu {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      font: inherit;
      font-size: 13px;
      padding: 7px 12px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    /* narrow screens: sidebar slides over the viewport, cards thin out */
    @media (max-width: 760px) {
      #sidebar {
        position: absolute;
        z-index: 10;
        transform: translateX(-100%);
        transition: transform 0.2s;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
      }
      body.menu-open #sidebar { transform: none; }
      #menu { display: block; }
      .card { background: rgba(24, 26, 31, 0.35); }
      #info { max-width: calc(100% - 110px); padding: 9px 12px 10px; }
      #info .title { font-size: 21px; }
      #info .desc { font-size: 13px; }
      #controls .hint { display: none; }
      #hud-bottom { flex-direction: column; align-items: stretch; }
      #legend { display: none; }
    }
    @media (max-width: 760px) and (max-height: 760px) {
      #info .desc { display: none; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h1>Crystal Viewer</h1>
    <p class="tagline">Real crystal structures, ball and stick</p>
    <nav id="list"></nav>
  </aside>

  <main id="viewport">
    <div id="labels"></div>

    <div id="info" class="card">
      <div class="title" id="title"></div>
      <div class="desc" id="desc"></div>
      <div class="facts" id="facts"></div>
    </div>

    <div id="hud-bottom">
      <div id="legend" class="card"></div>

      <a id="sourcelink" class="card" href="https://github.com/jfblanchard/crystal-viewer" target="_blank" rel="noopener">
        <span class="label">Source:</span>
        <span class="url">github.com/jfblanchard/crystal-viewer</span>
      </a>

      <div id="controls" class="card">
        <div id="tiling"></div>
        <label>Atom size <input type="range" id="size" min="0.15" max="1" step="0.01" value="0.4" /><span class="v" id="size-v"></span></label>
        <label>Sticks <input type="range" id="stick" min="0" max="2" step="0.05" value="1" /><span class="v" id="stick-v"></span></label>
        <label>Opacity <input type="range" id="opacity" min="0.15" max="1" step="0.01" value="0.9" /><span class="v" id="opacity-v"></span></label>
        <div class="row">
          <label><input type="checkbox" id="spin" checked /> Auto-rotate</label>
          <label><input type="checkbox" id="cell" checked /> Unit cell</label>
          <label><input type="checkbox" id="poly" /> Polyhedra</label>
          <label><input type="checkbox" id="axes" /> Axes</label>
        </div>
        <div class="hint">Atom size 100% = real radius: neighbors touch</div>
        <div class="hint">Drag to rotate · scroll to zoom · right-drag to pan</div>
      </div>
    </div>

    <button id="menu">Structures</button>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
